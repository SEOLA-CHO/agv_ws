relative_motion_controller:
  ros__parameters:
    control_rate: 20.0
    odom_timeout: 0.2
    default_goal_timeout: 30.0

    default_max_linear_speed: 0.20
    default_max_angular_speed: 0.40

    angular_gain: 1.8
    position_tolerance: 0.01
    yaw_tolerance: 0.0174533
    # At 0.4 rad/s, stop this far early to absorb measured drivetrain coast.
    yaw_stop_lead: 0.0872665
    settle_cycles: 5
