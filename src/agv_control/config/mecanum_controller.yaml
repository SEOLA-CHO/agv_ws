mecanum_controller:
  ros__parameters:
    wheel_radius: 0.0762
    wheel_base: 0.445
    wheel_track: 0.400

    # 15000 ERPM / 916.73 ERPM-per-rad/s.
    max_wheel_speed: 16.36
    command_timeout: 0.5
    publish_rate: 50.0

    # ROS convention: positive angular.z is counter-clockwise.
    rotation_direction: 1.0

    # 10 m hardware calibration, order=[FL, FR, RL, RR].
    # Counteracts the measured constant counter-clockwise path curvature.
    front_left_scale: 1.0064
    front_right_scale: 0.9936
    rear_left_scale: 1.0064
    rear_right_scale: 0.9936
